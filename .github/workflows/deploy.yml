# 글을 올리면(=push 하면) 자동으로 사이트를 다시 만들어 배포합니다.
name: 사이트 배포

on:
  push:
    branches: [main, master]
  # 필요할 때 손으로 실행할 수도 있습니다 (Actions 탭 → Run workflow)
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나씩만
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 사이트 빌드
        run: npm run build

      - name: Pages 설정 확인
        uses: actions/configure-pages@v5

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 로 배포
        id: deployment
        uses: actions/deploy-pages@v4
